<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#29ABE2">
<title>Чек-лист уборки — Системы Сервиса</title>

<style>
:root{--brand:#29ABE2;--brand-dark:#1A8FBB;--bg:#F4F8FB;--surface:#FFF;--surface2:#E8F6FC;--text:#2C2C2A;--text2:#5F5E5A;
--border:rgba(0,0,0,.12);--ok-bg:#E8F6FC;--red:#E24B4A;--red-bg:#FCEBEB;--gray:#888780;--gray-bg:#EDEAE2;--amber:#F5A623;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;padding-bottom:120px;}
.app-header{background:var(--brand);color:#fff;padding:14px 16px 16px;margin:0 0 12px;}
.app-header-inner{max-width:720px;margin:0 auto;}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-row svg{flex-shrink:0;}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.04em;line-height:1.2;}
.app-subtitle{font-size:14px;font-weight:400;color:rgba(255,255,255,.8);margin:0;padding-left:34px;}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 24px;}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;}
select,input,textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:.5px solid rgba(0,0,0,.22);border-radius:8px;background:var(--surface);color:var(--text);}
textarea{min-height:72px;resize:vertical;}
.houses-list{margin-top:10px;}
.house-row{border:.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
.house-row.selected{border-color:var(--brand);background:var(--ok-bg);}
.house-top{display:flex;align-items:flex-start;gap:8px;}
.house-top input{width:auto;margin-top:3px;}
.pick-label{font-size:11px;color:var(--brand-dark);margin:10px 0 4px;width:100%;}
.floors-wrap,.entrances-wrap{display:none;margin-top:4px;flex-wrap:wrap;gap:6px;width:100%;}
.house-row.selected .floors-wrap,.house-row.selected .entrances-wrap{display:flex;}
.pill-btn{font-size:13px;padding:6px 12px;border-radius:8px;border:.5px solid rgba(0,0,0,.22);background:var(--surface);cursor:pointer;color:var(--text);}
.pill-btn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.pill-btn.locked{background:var(--gray-bg);color:var(--text2);cursor:default;opacity:.85;}
.score-panel{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;margin:-8px 0 4px;}
.score-card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;}
.score-main{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.score-val{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;}
.score-val.good{color:var(--brand)}.score-val.warn{color:var(--amber)}.score-val.bad{color:var(--red)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:10px;}
.bar>div{height:100%;border-radius:4px;transition:width .2s;background:var(--brand);}
.agg{display:grid;grid-template-columns:1fr;gap:6px;font-size:12px;}
.agg div{display:flex;justify-content:space-between;color:var(--text2);}
.agg b{color:var(--text);font-weight:500;}
.zone{margin-bottom:10px;}
.zone-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface);border:.5px solid var(--border);border-radius:12px;cursor:pointer;user-select:none;border-left:3px solid transparent;}
.zone.open .zone-h{border-left-color:var(--brand);}
.zone-h h2{font-size:15px;font-weight:500;margin:0;flex:1;}
.zone-pct{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.zone.open .zone-h{border-radius:12px 12px 0 0;}
.zone-body{display:none;background:var(--surface);border:.5px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:0 10px 10px;}
.zone.open .zone-body{display:block;}
.item{padding:10px 4px;border-bottom:.5px solid var(--border);}
.item:last-child{border-bottom:none;}
.item-title{font-size:13px;margin-bottom:8px;}
.item.ok{background:var(--ok-bg);border-radius:8px;padding:10px;}
.item.fail{background:var(--red-bg);border-radius:8px;padding:10px;}
.item.na-row{background:var(--gray-bg);border-radius:8px;padding:10px;}
.btns{display:flex;gap:8px;}
.btn-v{flex:1;padding:10px;border-radius:8px;border:.5px solid rgba(0,0,0,.2);background:var(--surface);font-size:18px;cursor:pointer;transition:.15s;}
.btn-v.ok.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(41,171,226,.4);}
.btn-v.fail.on{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(226,75,74,.35);}
.btn-v.na.on{background:var(--gray);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.fail-block{margin-top:10px;display:none;}
.item.fail .fail-block{display:block;}
.warn-photo{font-size:12px;color:var(--red);margin-top:6px;}
.photo-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:.5px solid var(--border);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer;line-height:1;}
.btn-cam{font-size:13px;padding:8px 12px;border-radius:8px;border:.5px dashed var(--border);background:var(--surface2);cursor:pointer;}
.submit-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%);z-index:30;}
.submit-bar button{width:100%;max-width:720px;margin:0 auto;display:block;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;}
.submit-bar button:disabled{opacity:.5;}
.page-footer{max-width:720px;margin:16px auto 0;padding:0 14px;text-align:center;font-size:11px;color:var(--text2);}
.toast{position:fixed;bottom:80px;left:14px;right:14px;max-width:692px;margin:0 auto;padding:12px 14px;background:#2C2C2A;color:#fff;border-radius:10px;font-size:13px;z-index:40;transform:translateY(120%);transition:.25s;}
.toast.show{transform:translateY(0);}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;}
.overlay.show{display:flex;flex-direction:column;}
.overlay h2{font-size:22px;margin:0 0 8px;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.offline-badge{font-size:11px;background:var(--ok-bg);color:var(--brand-dark);padding:3px 10px 3px 22px;border-radius:6px;margin-left:8px;display:none;position:relative;}
.offline-badge::before{content:'';position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--brand);}
body.offline .offline-badge{display:inline}
.draft-banner{display:none;background:#E8F6FC;border:1px solid #29ABE2;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.draft-banner.show{display:block}
.draft-banner p{margin:0 0 10px;font-size:13px;color:var(--text)}
.draft-banner-actions{display:flex;gap:8px;flex-wrap:wrap}
.draft-banner-actions button{flex:1;min-width:120px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.draft-banner-actions .btn-continue{background:var(--brand);color:#fff}
.draft-banner-actions .btn-reset{background:var(--gray-bg);color:var(--text2);border:.5px solid var(--border)!important}
.page-footer #draft-indicator{color:var(--text2)}
</style>
</head>

<script>
const ZONES = [{"id": "territory", "group": "territory", "title": "1. Прилегающая территория", "parkingNa": false, "items": [{"num": "1.1", "text": "Дорожное покрытие, проезды, бордюры, ливневые решётки", "naAllowed": false}, {"num": "1.2", "text": "Парковочные места", "naAllowed": false}, {"num": "1.3", "text": "Тротуары, пешеходные дорожки", "naAllowed": false}, {"num": "1.4", "text": "Газон", "naAllowed": false}, {"num": "1.5", "text": "Деревья, кустарники, цветники", "naAllowed": false}, {"num": "1.6", "text": "Покраска: люки, разметка, МАФ, бордюры", "naAllowed": false}, {"num": "1.7", "text": "МАФ: лавочки, беседки, вазоны, светильники", "naAllowed": false}, {"num": "1.8", "text": "Детские площадки", "naAllowed": false}, {"num": "1.9", "text": "Спортивные площадки", "naAllowed": false}, {"num": "1.10", "text": "Мусорные урны", "naAllowed": false}, {"num": "1.11", "text": "Входные группы: урны, ступени, пандус, фасад", "naAllowed": false}, {"num": "1.12", "text": "Козырьки входных групп", "naAllowed": false}, {"num": "1.13", "text": "Элементы благоустройства: столбики, фонари, стенды", "naAllowed": false}]}, {"id": "containers", "group": "containers", "title": "2. Контейнерные площадки", "parkingNa": false, "items": [{"num": "2.1", "text": "Мусор в контейнерах (не переполнены)", "naAllowed": false}, {"num": "2.2", "text": "Мусор и посторонние предметы на площадке", "naAllowed": false}, {"num": "2.3", "text": "Чистота: пол, стены, дверь МСК", "naAllowed": false}, {"num": "2.4", "text": "Отсутствие неприятного запаха", "naAllowed": false}]}, {"id": "entrance", "group": "cleaning", "title": "3. Входная группа (1 этаж)", "parkingNa": false, "items": [{"num": "3.1", "text": "Входная дверь, остекление до 1,7м, стены", "naAllowed": false}, {"num": "3.2", "text": "Остекление выше 1,7м", "naAllowed": false}, {"num": "3.3", "text": "Грязезащитные ковры", "naAllowed": false}, {"num": "3.4", "text": "Горизонтальные поверхности: ящики, подоконники, батареи", "naAllowed": false}, {"num": "3.5", "text": "Пол, плинтуса", "naAllowed": false}, {"num": "3.6", "text": "Стены, стекло до 1,7м", "naAllowed": false}, {"num": "3.7", "text": "Стены, стекло выше 1,7м", "naAllowed": false}, {"num": "3.8", "text": "Информационная доска, график уборки", "naAllowed": false}]}, {"id": "elevators", "group": "cleaning", "title": "4. Лифты", "parkingNa": false, "items": [{"num": "4.1", "text": "Пол внутри лифта", "naAllowed": false}, {"num": "4.2", "text": "Наличники, двери, полозья", "naAllowed": false}, {"num": "4.3", "text": "Кнопки, стены, зеркала, поручни", "naAllowed": false}, {"num": "4.4", "text": "Потолок, плафоны", "naAllowed": false}]}, {"id": "mop", "group": "cleaning", "title": "5. МОП (этажи)", "parkingNa": false, "items": [{"num": "5.1", "text": "Двери в МОП", "naAllowed": false}, {"num": "5.2", "text": "Горизонтальные поверхности до 1,7м", "naAllowed": false}, {"num": "5.3", "text": "Пол, плинтуса", "naAllowed": false}, {"num": "5.4", "text": "Строительный мусор, вещи жильцов", "naAllowed": false}, {"num": "5.5", "text": "Окна до 1,7м", "naAllowed": false}, {"num": "5.6", "text": "Стены (реклама, загрязнения)", "naAllowed": false}, {"num": "5.7", "text": "Поверхности выше 1,7м", "naAllowed": false}, {"num": "5.8", "text": "Плафоны, вентиляционные решётки", "naAllowed": false}, {"num": "5.9", "text": "Пожарная лестница: личные вещи", "naAllowed": false}, {"num": "5.10", "text": "Пожарная лестница: пол, стены, перила", "naAllowed": false}]}, {"id": "office", "group": "other", "title": "6. Офис УК", "parkingNa": false, "items": [{"num": "6.1", "text": "Входная дверь, фасад, тамбур", "naAllowed": false}, {"num": "6.2", "text": "Клиентская зона: пол, стены, мебель, урны", "naAllowed": false}, {"num": "6.3", "text": "Санузел: пол, стены, зеркало, сантехника", "naAllowed": false}]}, {"id": "parking", "group": "other", "title": "7. Паркинг", "parkingNa": true, "items": [{"num": "7.1", "text": "Покрытие: лужи, мусор, масло", "naAllowed": true}, {"num": "7.2", "text": "Строительный мусор, вещи жильцов", "naAllowed": true}, {"num": "7.3", "text": "Стены: вандальные надписи", "naAllowed": true}, {"num": "7.4", "text": "Фасад: объявления", "naAllowed": true}]}];
const PROXY = '../proxy.php';
const API_SAVE = './api/checklist/save.php';
const LS_CACHE = 'checklist_tb_cache';
const LS_PENDING = 'checklist_pending';
const LS_DRAFT = 'checklist_draft';
const FLOOR_ZONES = new Set(['entrance','elevators','mop']);

const state = { projectId:'', jkName:'', manager:'', housesAvailable:[], selectedHouses:{}, items:{}, zoneComments:{} };
let allItemNums = [];
let suppressDraft = false;

function initItems(){
  allItemNums = [];
  ZONES.forEach(z => z.items.forEach(it => {
    allItemNums.push(it.num);
    if(!state.items[it.num]) state.items[it.num] = { value:null, floors:[], entrances:[], comment:'', photos:[] };
  }));
}

function getSelectedHouses(){
  return Object.values(state.selectedHouses).filter(h => h.checked);
}

function getUnionFloors(){
  const s = new Set([1]);
  getSelectedHouses().forEach(h => (h.floors||[]).forEach(f => s.add(f)));
  return [...s].sort((a,b)=>a-b);
}

function getUnionEntrances(){
  const s = new Set();
  getSelectedHouses().forEach(h => (h.entrances||[]).forEach(e => s.add(e)));
  return [...s].sort((a,b)=>a-b);
}

async function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1024;
      let w = img.width, h = img.height;
      if(w > h && w > MAX){ h = h * MAX / w; w = MAX; }
      else if(h > MAX){ w = w * MAX / h; h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Не удалось загрузить изображение'));
    };
    img.src = url;
  });
}

function dataUrlToFile(dataUrl, name){
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(parts[1] || parts[0]);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name || 'photo.jpg', { type: mime });
}

function photoToFile(photo, index){
  if(photo instanceof File) return photo;
  const dataUrl = photo.dataUrl || photo;
  return dataUrlToFile(dataUrl, photo.name || ('photo_' + index + '.jpg'));
}

function appendPhotoThumb(num, photo, pr){
  const thumb = document.createElement('div');
  thumb.className = 'photo-thumb';
  const img = document.createElement('img');
  img.src = photo.dataUrl || photo;
  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = '×';
  del.onclick = () => {
    const st = state.items[num];
    const i = st.photos.indexOf(photo);
    if(i >= 0) st.photos.splice(i, 1);
    thumb.remove();
    refreshItemRow(num, pr.closest('.item'));
    saveDraft();
  };
  thumb.append(img, del);
  pr.insertBefore(thumb, pr.firstChild);
}

function draftHasContent(d){
  if(!d) return false;
  return !!(d.jk?.projectId || d.manager || (d.houses && d.houses.length) ||
    Object.keys(d.state || {}).length || Object.keys(d.itemComments || {}).length ||
    Object.keys(d.photos || {}).length);
}

function buildDraft(includePhotos = true){
  const stateAnswers = {};
  const itemComments = {};
  const floorTags = {};
  const entranceTags = {};
  const photos = {};
  allItemNums.forEach(num => {
    const st = state.items[num];
    if(!st) return;
    if(st.value) stateAnswers[num] = st.value;
    if(st.comment) itemComments[num] = st.comment;
    if(st.floors?.length) floorTags[num] = [...st.floors];
    if(st.entrances?.length) entranceTags[num] = [...st.entrances];
    if(includePhotos && st.photos?.length){
      photos[num] = st.photos.map(p => p.dataUrl || p);
    }
  });
  const houses = Object.keys(state.selectedHouses).map(k => {
    const h = state.selectedHouses[k];
    if(!h?.checked) return null;
    return {
      idx: Number(k),
      addr: h.addr,
      label: h.label,
      locationId: h.locationId,
      floors: h.floors || [1],
      entrances: h.entrances || [],
    };
  }).filter(Boolean);
  return {
    jk: { projectId: state.projectId, jkName: state.jkName },
    manager: state.manager,
    houses,
    state: stateAnswers,
    itemComments,
    floorTags,
    entranceTags,
    photos,
    zoneComments: state.zoneComments || {},
    savedAt: Date.now(),
  };
}

function isQuotaError(e){
  return e && (e.name === 'QuotaExceededError' || e.code === 22);
}

function persistDraft(draft){
  localStorage.setItem(LS_DRAFT, JSON.stringify(draft));
  updateDraftIndicator(draft.savedAt);
}

function saveDraft(){
  if(suppressDraft) return;
  let draft = buildDraft(true);
  if(!draftHasContent(draft)) return;
  try{
    persistDraft(draft);
  }catch(e){
    if(!isQuotaError(e)){
      console.warn('draft save failed', e);
      return;
    }
    draft = buildDraft(false);
    if(!draftHasContent(draft)) return;
    try{
      persistDraft(draft);
      toast('Не удалось сохранить фото — слишком большой объём. Остальные данные сохранены.');
    }catch(e2){
      console.warn('draft save without photos failed', e2);
    }
  }
}

  allItemNums.forEach(num => {

    st.comment = draft.itemComments?.[num] || '';
    st.floors = draft.floorTags?.[num] ? [...draft.floorTags[num]] : [];
    st.entrances = draft.entranceTags?.[num] ? [...draft.entranceTags[num]] : [];
    st.photos = (draft.photos?.[num] || []).map((dataUrl, i) => ({
      dataUrl,
      name: 'photo_' + num.replace('.', '_') + '_' + i + '.jpg',
    }));
  });
  state.zoneComments = draft.zoneComments || {};

function zoneScore(zone){
  const items = zone.items;
  let ok=0, denom=0;
  items.forEach(it => {
    const v = state.items[it.num]?.value;
    if(!v) return;
    if(v==='na') return;
    denom++;
    if(v==='ok') ok++;
  });
  if(denom===0) return null;
  return Math.round(ok/denom*100);
}

function calcScores(){
  const zScores = {};
  ZONES.forEach(z => { zScores[z.id] = zoneScore(z); });
  const avg = arr => { const a=arr.filter(x=>x!=null); return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null; };
  const territory = zScores.territory;
  const containers = zScores.containers;
  const cleaning = avg([zScores.entrance,zScores.elevators,zScores.mop].filter(x=>x!=null));
  const allZones = Object.values(zScores).filter(x=>x!=null);
  const total = avg(allZones);
  return { total, territory, containers, cleaning, zScores };
}

function scoreClass(p){ if(p==null)return ''; if(p>=80)return 'good'; if(p>=50)return 'warn'; return 'bad'; }
function scoreColor(p){ if(p==null)return 'var(--gray)'; if(p>=80)return 'var(--brand)'; if(p>=50)return 'var(--amber)'; return 'var(--red)'; }

  const w = s.total!=null?s.total:0;
  bar.style.width = w+'%';

    el.style.color = scoreColor(val);

async function addPhoto(num, file, pr, warn){

  const st=state.items[num];
  if(st.photos.length>=5){ toast('Максимум 5 фото'); return; }
  try{
    const dataUrl = await compressImage(file);
    const entry = { dataUrl, name: file.name || 'photo.jpg' };
    st.photos.push(entry);
    appendPhotoThumb(num, entry, pr);
    refreshItemRow(num, pr.closest('.item'));

function validate(){
  for(const num of allItemNums){
    const st=state.items[num];
    if(!st.value){ return {ok:false, num, msg:'Заполните пункт'}; }
    if(st.value==='fail' && !st.photos.length){ return {ok:false, num, msg:'Нужно фото'}; }
  }
  if(!state.jkName) return {ok:false, msg:'Выберите ЖК'};
  if(!state.manager) return {ok:false, msg:'Выберите менеджера'};
  if(!getSelectedHouses().length) return {ok:false, msg:'Выберите хотя бы один дом'};
  return {ok:true};
}

function scrollToItem(num){
  const row=document.querySelector('.item[data-item-num="'+num+'"]');
  if(!row) return;
  const zone=row.closest('.zone');
  zone.classList.add('open');
  row.scrollIntoView({behavior:'smooth',block:'center'});
}

function buildPayload(){
  const scores=calcScores();
  const items=[];
  ZONES.forEach(z => z.items.forEach(it => {
    const st=state.items[it.num];
    items.push({zone_id:z.id, item_num:it.num, value:st.value, floors:st.floors||[], entrances:st.entrances||[], comment:st.comment||''});
  }));
  return {
    jk_name: state.jkName,
    manager_name: state.manager,
    checked_at: new Date().toISOString().slice(0,19).replace('T',' '),
    houses: getSelectedHouses().map(h=>({addr:h.addr, floors:h.floors, entrances:h.entrances||[]})),
    score_total: scores.total||0,
    score_territory: scores.territory||0,
    score_containers: scores.containers||0,
    score_cleaning: scores.cleaning||0,
    status: 'submitted',
    items
  };
}

async function submitChecklist(payload, photoMap){
  const fd=new FormData();
  fd.append('data', JSON.stringify(payload));
  Object.entries(photoMap).forEach(([num, files]) => {
    files.forEach((f, i) => {
      const key='photo_'+num.replace(/\./g,'_')+(i?'_'+i:'');
      const file = photoToFile(f, i);
      fd.append(key, file, file.name || 'photo.jpg');
    });
  });
  const res=await fetch(API_SAVE, {method:'POST', body:fd});
  const json=await res.json();
  if(!json.success) throw new Error(json.error||'Ошибка сохранения');
  return json;
}

function savePending(payload, photoBlobs){
  const pending=JSON.parse(localStorage.getItem(LS_PENDING)||'[]');
  pending.push({payload, photoBlobs, ts:Date.now()});
  localStorage.setItem(LS_PENDING, JSON.stringify(pending));
}

async function syncPending(){
  const pending=JSON.parse(localStorage.getItem(LS_PENDING)||'[]');
  if(!pending.length || !navigator.onLine) return;
  const left=[];
  for(const entry of pending){
    try{
      const photoMap={};
      for(const [num, blobs] of Object.entries(entry.photoBlobs||{})){
        photoMap[num]=blobs.map(b=>{
          const bin=atob(b.data); const arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
          return new File([arr], b.name||'photo.jpg', {type:b.type||'image/jpeg'});
        });
      }
      await submitChecklist(entry.payload, photoMap);
    }catch(e){ left.push(entry); }
  }
  localStorage.setItem(LS_PENDING, JSON.stringify(left));
}

async function fileToB64(file){
  const buf=await file.arrayBuffer();
  let bin=''; const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return {name:file.name, type:file.type, data:btoa(bin)};
}

document.getElementById('btn-submit').onclick=async ()=>{
  const v=validate();
  if(!v.ok){
    if(v.num){
      const it=ZONES.flatMap(z=>z.items.map(i=>({...i,zone:z}))).find(x=>x.num===v.num);
      scrollToItem(v.num);
      toast((it?it.num+' — '+it.text+'. ':'')+(v.msg==='Нужно фото'?'Обязательно фото — минимум 1 шт':v.msg));
    } else {
      toast(v.msg);
    }
    return;
  }
  const payload=buildPayload();
  const photoMap={};
  allItemNums.forEach(num=>{
    const ph=state.items[num].photos;
    if(ph.length) photoMap[num]=ph;
  });
  if(!navigator.onLine){
    const photoBlobs={};
    for(const [num, files] of Object.entries(photoMap)){
      photoBlobs[num]=files.map((p, i) => {
        const dataUrl = p.dataUrl || p;
        const b64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
        return { name: p.name || ('photo_' + i + '.jpg'), type: 'image/jpeg', data: b64 };
      });
    }
    savePending(payload, photoBlobs);
    if('serviceWorker' in navigator && 'SyncManager' in window){
      navigator.serviceWorker.ready.then(r=>r.sync.register('checklist-sync').catch(()=>{}));
    }
    document.getElementById('overlay-offline').classList.add('show');
    return;
  }
  document.getElementById('overlay-loading').classList.add('show');
  try{
    await submitChecklist(payload, photoMap);
    clearDraft();
    const sc=calcScores();
    document.getElementById('success-score').textContent='Итоговая оценка: '+(sc.total!=null?sc.total+'%':'—');
    document.getElementById('overlay-loading').classList.remove('show');
    document.getElementById('overlay-success').classList.add('show');
  }catch(e){
    document.getElementById('overlay-loading').classList.remove('show');
    toast(e.message||'Ошибка отправки');
  }
};

      b.type='button';
      b.className='pill-btn';
      b.textContent=e+' под.';
      b.onclick=()=>{
        const sh=state.selectedHouses[idx];
        if(!sh||!sh.checked) return;
        const i=sh.entrances.indexOf(e);
        if(i>=0) sh.entrances.splice(i,1); else sh.entrances.push(e);
        b.classList.toggle('on', sh.entrances.includes(e));
        document.querySelectorAll('.item.fail').forEach(el=>{
          const n=el.dataset.itemNum;
          if(n) refreshItemRow(n, el);
        });
        saveDraft();
      };
      ew.appendChild(b);
    }
    cb.onchange=()=>{
      if(cb.checked){
        row.classList.add('selected');
        state.selectedHouses[idx]={checked:true, addr:h.addr, label, locationId:h.locationId, floors:[1], entrances:[]};
        ew.querySelectorAll('.pill-btn').forEach(b=>b.classList.remove('on'));
      } else {
        row.classList.remove('selected');
        delete state.selectedHouses[idx];
      }
      document.querySelectorAll('.floors-fail').forEach(fl=>{
        const n=fl.dataset.item;
        if(n) refreshItemRow(n, fl.closest('.item'));
      });
      saveDraft();
    };
    root.appendChild(row);
  });
}

async function loadHouses(projectId){
  const root=document.getElementById('houses-list');
  root.innerHTML='<p style="font-size:13px;color:var(--text2)">Загрузка домов…</p>';
  try{
    const data=await fetchJSON(PROXY+'?action=houses&project='+projectId);
    const houses=data.houses||[];
    cacheSet('houses_'+projectId, houses);
    renderHouses(houses);
  }catch(e){
    const cached=cacheGet('houses_'+projectId);
    if(cached) renderHouses(cached);
    else { root.innerHTML='<p style="color:var(--red)">Ошибка загрузки домов</p>'; toast('Ошибка загрузки домов'); }
  }
}

document.getElementById('jk-select').onchange=function(){
  const opt=this.selectedOptions[0];
  state.projectId=this.value;
  state.jkName=opt?opt.textContent:'';
  state.selectedHouses={};
  if(this.value) loadHouses(this.value);
  saveDraft();
};
document.getElementById('mgr-select').onchange=function(){
  state.manager=this.value;
  saveDraft();
};

function setOffline(){
  document.body.classList.toggle('offline', !navigator.onLine);
}
window.addEventListener('online', ()=>{ setOffline(); syncPending(); });
window.addEventListener('offline', setOffline);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{});
  });
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data?.type==='sync-pending') syncPending();
  });
}

(async function boot(){
  initItems();
  renderZones();
  await Promise.all([loadProjects(), loadManagers()]);
  setupDraftBanner();
  const existing = loadDraftRaw();
  if(draftHasContent(existing)) updateDraftIndicator(existing.savedAt);
  setOffline();
  syncPending();
  updateScoreUI();
})();
</script>
</body>
